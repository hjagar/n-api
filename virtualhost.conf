<VirtualHost *:80>
    ServerName api.tusitio.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName api.tusitio.com
    DocumentRoot /var/www/html/src
    <Directory /var/www/html/src>
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.tusitio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.tusitio.com/privkey.pem
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    ErrorLog ${APACHE_LOG_DIR}/api_error.log
    CustomLog ${APACHE_LOG_DIR}/api_access.log combined
</VirtualHost>
